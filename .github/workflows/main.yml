name: Exercise-02-tests-workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  Exercise-02-tests-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v3

      - name: Cache and Install Valgrind
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: valgrind
          version: 1.0

      - name: Prerequisite Setup
        run: |
          git clone https://$GH_PAT@github.com/Cyber-Education-Center/ExerciseTests-Utils.git utils
          cd utils
          g++ printMessage.cpp -o printMessage
          chmod +x printMessage
          mv printMessage ..
          mv CodesToMessages.csv ..
          cd ..
          rm -rf utils

          git clone https://$GH_PAT@github.com/Cyber-Education-Center/ExerciseTests-Ex02.git ex2
          mv ex2/* .
          rm -rf ex2 .git .github

          git clone https://$GH_PAT@github.com/Cyber-Education-Center/ExerciseTests-ValgrindVarifier.git/ valgrindvarifierDIR
          cd valgrindvarifierDIR
          g++ ValgrindVarifier.cpp -o valgrindverifier
          chmod +x valgrindverifier
          mv valgrindverifier ..
          cd ..
          rm -rf valgrindvarifierDIR



          cat <<EOF > results.json
          {
            "grades": {
              "part1": 0,
              "part2": 0,
              "part3": 0,
              "part4": 0
            }
          }
          EOF
        env:
          GH_PAT: ${{ secrets.GIT_TOKEN }}

      - name: Verify Submission Files
        run: |
          git clone https://$GH_PAT@github.com/Cyber-Education-Center/ExerciseTests-VerifySubmittedFiles.git verifysubmittedfiles
          cd verifysubmittedfiles
          go build .
          chmod +x filesverifier
          mv filesverifier ..
          cd .. && rm -rf verifysubmittedfiles
          ./filesverifier PreSubmissionChecker.txt 5
          ./filesverifier PreSubmissionChecker.txt 2
          ./filesverifier PreSubmissionChecker.txt 4
        env:
          GH_PAT: ${{ secrets.GIT_TOKEN }}

      - name: Compile and Test Part 1
        run: |
          ./filesverifier Part1Checker.txt 1
          mkdir -p temp123
          mv Ex2Part1Test.cpp temp123/
          cd temp123
          g++ Device.cpp Ex2Part1Test.cpp -o exec1
          mv exec1 ..
          cd ..
          chmod +x exec1
          if ./exec1; then score=10; else score=0; fi
          jq ".grades.part1 = $score" results.json > tmp.json && mv tmp.json results.json

      - name: Memory Check Part 1
        run: |
          valgrind --leak-check=yes --log-file=valgrind-out1.txt ./exec1
          ./valgrindverifier valgrind-out1.txt

      - name: Compile and Test Part 2
        run: |
          ./filesverifier Part2Checker.txt 1
          mkdir -p temp123
          mv Ex2Part2Test.cpp temp123/
          cd temp123
          g++ Device.cpp User.cpp DeviceList.cpp Ex2Part2Test.cpp -o exec2
          mv exec2 ..
          cd ..
          chmod +x exec2
          if ./exec2; then score=26.25; else score=0; fi
          jq ".grades.part2 = $score" results.json > tmp.json && mv tmp.json results.json

      - name: Memory Check Part 2
        run: |
          valgrind --leak-check=yes --log-file=valgrind-out2.txt ./exec2
          ./valgrindverifier valgrind-out2.txt

      - name: Compile and Test Part 3
        run: |
          ./filesverifier Part3Checker.txt 1
          mkdir -p temp123
          mv Ex2Part3Test.cpp temp123/
          cd temp123
          g++ Device.cpp User.cpp DeviceList.cpp Profile.cpp Page.cpp UserList.cpp Ex2Part3Test.cpp -o exec3
          mv exec3 ..
          cd ..
          chmod +x exec3
          if ./exec3; then score=41.25; else score=0; fi
          jq ".grades.part3 = $score" results.json > tmp.json && mv tmp.json results.json

      - name: Memory Check Part 3
        run: |
          valgrind --leak-check=yes --log-file=valgrind-out3.txt ./exec3
          ./valgrindverifier valgrind-out3.txt

      - name: Compile and Test Part 4
        run: |
          ./filesverifier Part4Checker.txt 1
          mkdir -p temp123
          mv Ex2Part4Test.cpp temp123/
          cd temp123
          g++ Device.cpp User.cpp DeviceList.cpp Profile.cpp Page.cpp UserList.cpp ProfileList.cpp SocialNetwork.cpp Ex2Part4Test.cpp -o exec4
          mv exec4 ..
          cd ..
          chmod +x exec4
          if ./exec4 4; then score=22.5; else score=0; fi
          jq ".grades.part4 = $score" results.json > tmp.json && mv tmp.json results.json

      - name: Memory Check Part 4
        run: |
          ./exec4 4
          valgrind --leak-check=yes --log-file=valgrind-out4.txt -- ./exec4 4
          ./valgrindverifier valgrind-out4.txt

      - name: Run Bonus Test
        run: |
          ./filesverifier BonusChecker.txt 1
          mkdir -p temp123
          mv Ex2BonusTest.cpp temp123/
          cd temp123
          g++ Device.cpp User.cpp DeviceList.cpp Profile.cpp Page.cpp UserList.cpp Ex2BonusTest.cpp -o execbonus
          mv execbonus ..
          cd ..
          chmod +x execbonus
          ./execbonus || true

      - name: Summary
        if: always()
        run: |
          echo "All tests completed."
          total=$(jq '[.grades.part1, .grades.part2, .grades.part3, .grades.part4] | add' results.json)
          avg=$(jq -n "($total / 100 * 100) | round")
          echo "Final score: $avg% ($total out of 100)"
          echo -n "Final results.json:"; cat results.json | tr -d '\n'
